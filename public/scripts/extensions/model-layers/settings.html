<div class="model_layers_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Model Layers</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="model_layers_enabled">
                <input id="model_layers_enabled" type="checkbox" />
                <span>Apply the declared preset when the model changes</span>
            </label>
            <label class="checkbox_label" for="model_layers_pin">
                <input id="model_layers_pin" type="checkbox" />
                <span>Keep declared settings pinned until another model is selected</span>
            </label>
            <div id="model_layers_status" class="model_layers_status"></div>
            <div class="menu_button menu_button_icon" id="model_layers_reapply">
                <i class="fa-solid fa-rotate"></i>
                <span>Reapply now</span>
            </div>
        </div>
    </div>
</div>
